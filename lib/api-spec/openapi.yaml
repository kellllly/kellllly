openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - ClerkSession: []
tags:
  - name: health
    description: Health operations
  - name: itsm
    description: Shared pilot ITSM workspace
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /itsm:
    get:
      operationId: getItsmWorkspace
      tags: [itsm]
      summary: Read the shared ITSM workspace
      responses:
        "200":
          description: Shared workspace and its version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmSnapshot"
        "401":
          description: Authentication required
        "403":
          description: A role assignment is required or the role lacks permission
    put:
      operationId: saveItsmWorkspace
      tags: [itsm]
      summary: Save validated changes to the shared ITSM workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmSaveInput"
      responses:
        "200":
          description: Updated shared workspace and its version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmSnapshot"
        "400":
          description: Invalid workspace change
        "401":
          description: Authentication required
        "409":
          description: Workspace changed; latest snapshot is included for controlled recovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmWorkspaceConflict"
        "403":
          description: The assigned role cannot perform this change
    post:
      operationId: importItsmExamples
      tags: [itsm]
      summary: Import local demo examples without overwriting shared data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmImportInput"
      responses:
        "200":
          description: Shared workspace after a safe one-time import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmSnapshot"
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot import examples
  /itsm/conversations/{conversationId}/messages:
    post:
      operationId: postItsmTemporaryMessage
      tags: [itsm]
      summary: Post a message in a temporary channel (members only, until its end date)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmTemporaryMessage"
      responses:
        "201":
          description: Message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmTemporaryMessagePosted"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
        "403":
          description: The channel is not accessible to this account
        "409":
          description: The channel is closed
  /itsm/presence:
    put:
      operationId: setItsmPresence
      tags: [itsm]
      summary: The signed-in agent sets their own presence status, shown to the people they share a conversation with
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmPresenceInput"
      responses:
        "200":
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmPresence"
        "400":
          description: Unknown status
        "401":
          description: Authentication required
  /itsm/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, maxLength: 64 }
      - in: path
        name: messageId
        required: true
        schema: { type: string, maxLength: 64 }
    patch:
      operationId: editItsmMessage
      tags: [itsm]
      summary: The author corrects a message within 5 minutes; the journal keeps hashes of both versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmTemporaryMessage"
      responses:
        "200":
          description: Message corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmMessageRevised"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
        "403":
          description: Only the author may change the message
        "409":
          description: Deadline passed, message gone, converted into an incident, or channel closed
    delete:
      operationId: deleteItsmMessage
      tags: [itsm]
      summary: The author deletes a message; its text is erased and the deletion is journaled
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmMessageRevised"
        "401":
          description: Authentication required
        "403":
          description: Only the author may delete the message
        "409":
          description: Message gone, converted into an incident, or channel closed
  /itsm/session:
    get:
      operationId: getItsmSessionMarker
      tags: [itsm]
      summary: Account and network address shown in the on-screen watermark
      responses:
        "200":
          description: Watermark details for the authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmSessionMarker"
        "401":
          description: Authentication required
        "403":
          description: A role assignment is required
  /itsm/version:
    get:
      operationId: getItsmWorkspaceVersion
      tags: [itsm]
      summary: Read only the version of the shared ITSM workspace
      description: Lightweight polling endpoint. Clients fetch the full workspace only when the version changes.
      responses:
        "200":
          description: Current workspace version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmWorkspaceVersion"
        "401":
          description: Authentication required
        "403":
          description: A role assignment is required or the role lacks permission
  /itsm/people:
    get:
      operationId: getItsmPeople
      tags: [itsm]
      summary: Resolve account IDs to display names
      description: Returns a display name for each requested Clerk user ID. No e-mail, role or service scope is returned.
      parameters:
        - in: query
          name: ids
          required: true
          description: Comma-separated Clerk user IDs (at most 100)
          schema: { type: string, maxLength: 7000 }
      responses:
        "200":
          description: Display names, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmPeople"
        "400":
          description: Missing, malformed or too many IDs
        "401":
          description: Authentication required
        "403":
          description: A role assignment is required or the role lacks permission
        "503":
          description: Account directory is temporarily unavailable
  /itsm/contacts:
    get:
      operationId: getItsmContacts
      tags: [itsm]
      summary: Colleagues who can join a bilateral channel
      description: For N1 to N3 accounts. Returns other N1 to N3 accounts whose name matches the search, with name and role only (no e-mail). The search runs on names, never on e-mail addresses.
      parameters:
        - in: query
          name: q
          required: false
          description: Part of a name (at most 80 characters)
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Matching colleagues, at most 20
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmContacts"
        "400":
          description: Invalid search
        "401":
          description: Authentication required
        "403":
          description: Only N1 to N3 accounts can open a bilateral channel
        "503":
          description: Account directory is temporarily unavailable
  /itsm/audit/export:
    get:
      operationId: exportItsmAudit
      tags: [itsm]
      summary: Export filtered audit events as CSV
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: scope
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Filtered CSV audit events
          content:
            text/csv:
              schema: { type: string }
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
  /itsm/audit/integrity:
    get:
      operationId: getItsmAuditIntegrity
      tags: [itsm]
      summary: Verify the hash chain of the activity journal
      responses:
        "200":
          description: Result of the journal hash-chain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmAuditIntegrity"
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
        "503":
          description: The journal could not be read
  /itsm/audit/proof:
    get:
      operationId: getItsmAuditProof
      tags: [itsm]
      summary: Merkle inclusion proof of one journal event
      parameters:
        - in: query
          name: event
          required: true
          description: Event identifier or sequence number
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: treeSize
          description: Size of the checkpoint tree (default the whole journal)
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Inclusion proof against the root of the requested tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmAuditProof"
        "400":
          description: Invalid event reference or tree size
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
        "404":
          description: No sealed event with this reference
        "409":
          description: The journal chain is not intact
        "503":
          description: The journal could not be read
  /itsm/audit/siem:
    get:
      operationId: getItsmAuditSiemFeed
      tags: [itsm]
      summary: Journal feed for a SIEM collector (NDJSON, ECS field names)
      parameters:
        - in: query
          name: after
          description: Last sequence already received (0 to start)
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: One event per line, oldest first
          headers:
            X-ANIF-Next-After:
              description: Sequence to pass as after on the next poll
              schema: { type: integer }
            X-ANIF-Journal-Head:
              description: Highest sequence in the journal
              schema: { type: integer }
            X-ANIF-Chain-Status:
              description: Hash-chain state (intact, broken, empty, unsealed)
              schema: { type: string }
          content:
            application/x-ndjson:
              schema: { type: string }
        "400":
          description: Invalid cursor or limit
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
        "503":
          description: The journal could not be read
  /itsm/audit/timestamps:
    get:
      operationId: getItsmAuditTimestamps
      tags: [itsm]
      summary: RFC 3161 timestamps of the journal, re-verified
      responses:
        "200":
          description: Timestamps, newest first (20 at most)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmAuditTimestamps"
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
        "429":
          description: Too many journal requests
        "503":
          description: The journal could not be read
    post:
      operationId: createItsmAuditTimestamp
      tags: [itsm]
      summary: Have the configured timestamp authority sign today's checkpoint
      responses:
        "201":
          description: Timestamp journaled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmAuditTimestampCreated"
        "401":
          description: Authentication required
        "403":
          description: Only N1 and N3 can request a timestamp
        "409":
          description: The chain is not intact or changed meanwhile
        "429":
          description: Too many journal requests
        "502":
          description: The authority did not answer or its token was rejected
        "503":
          description: No authority configured, or the journal could not be read
  /itsm/audit/timestamps/{id}/token:
    get:
      operationId: getItsmAuditTimestampToken
      tags: [itsm]
      summary: Download a stored RFC 3161 token (DER)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: TimeStampResp, to check with openssl ts -verify
          content:
            application/timestamp-reply:
              schema: { type: string, format: binary }
        "401":
          description: Authentication required
        "403":
          description: The assigned role cannot export the audit log
        "404":
          description: No timestamp with this identifier
  /itsm/users:
    get:
      operationId: getItsmUserDirectory
      tags: [itsm]
      summary: List pilot accounts for N1 role management
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Minimal account identity and current ITSM role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmUserDirectoryPage"
        "400":
          description: Invalid pagination or search parameters
        "401":
          description: Authentication required
        "403":
          description: Only N1 can list pilot accounts
        "503":
          description: Account directory is temporarily unavailable
  /itsm/role-archive/check:
    post:
      operationId: checkItsmRoleArchive
      tags: [itsm]
      summary: Check the external role archive connection without creating an event
      responses:
        "200":
          description: The configured archive responded to the connection check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmRoleArchiveCheckResponse"
        "401":
          description: Authentication required
        "403":
          description: Only N1 can check the role archive
        "503":
          description: The configured archive is unavailable or does not support the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmRoleArchiveCheckFailureResponse"
  /itsm/users/{userId}/role:
    put:
      operationId: assignItsmRole
      tags: [itsm]
      summary: Change an ITSM role, name an N1 successor, or revoke access
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmRoleAssignmentInput"
      responses:
        "200":
          description: Role assignment saved to Clerk metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmRoleAssignment"
        "400":
          description: Invalid role assignment
        "401":
          description: Authentication required
        "403":
          description: Only N1 can assign roles
        "404":
          description: Clerk account not found
  /itsm/development-role-archive:
    head:
      operationId: checkDevelopmentRoleArchive
      tags: [itsm]
      summary: Check the development-only archive receiver and its storage
      security:
        - DevelopmentArchiveToken: []
      responses:
        "204":
          description: Authenticated receiver and storage available
        "401":
          description: Invalid archive credential
        "404":
          description: Receiver disabled outside explicitly configured development
        "503":
          description: Storage unavailable
    post:
      operationId: appendDevelopmentRoleArchive
      tags: [itsm]
      summary: Persist an event in the development-only, same-environment archive
      description: Not an independent or immutable production archive. No read, update or delete API.
      security:
        - DevelopmentArchiveToken: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentRoleArchiveEnvelope"
      responses:
        "200":
          description: Event persisted, or identical event already persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentRoleArchiveReceipt"
        "400":
          description: Invalid event or idempotency key
        "401":
          description: Invalid archive credential
        "404":
          description: Development receiver disabled
        "409":
          description: Event identifier already used for different content
        "503":
          description: Event not confirmed in storage
  /itsm/roles/reconciliation:
    get:
      operationId: getItsmRoleReconciliation
      tags: [itsm]
      summary: Accounts whose Clerk role differs from the authorization journal
      description: For N1 accounts. Compares the current Clerk role and services of every account with the latest role event of the journal. Read-only; regularize with the attestation route after verification.
      responses:
        "200":
          description: Current findings (empty when the journal matches Clerk)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmRoleReconciliation"
        "401":
          description: Authentication required
        "403":
          description: Only N1 can review the authorization journal
        "503":
          description: Clerk or the journal is temporarily unavailable
  /itsm/users/{userId}/role/attest:
    post:
      operationId: attestItsmRole
      tags: [itsm]
      summary: Attest the current ITSM role without changing Clerk metadata
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItsmRoleAttestationInput"
      responses:
        "200":
          description: Current role attestation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItsmRoleAttestation"
        "400":
          description: Invalid target account
        "401":
          description: Authentication required
        "403":
          description: Only N1 can attest roles
        "404":
          description: Clerk account not found
        "409":
          description: Target account has no valid ITSM role to attest
        "503":
          description: Role archive or journal is unavailable
components:
  securitySchemes:
    DevelopmentArchiveToken:
      type: http
      scheme: bearer
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    DevelopmentRoleArchiveEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, source, event]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        source:
          type: string
          enum: [anif-secure-desk]
        event:
          type: object
          additionalProperties: false
          required: [id, type, actor, targetUserId, previousRole, nextRole, previousServiceIds, serviceIds, scope, at]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 200
            type:
              type: string
              enum: [itsm.role.changed, itsm.role.attested]
            actor:
              type: string
              minLength: 1
              maxLength: 200
            targetUserId:
              type: string
              minLength: 1
              maxLength: 200
            previousRole:
              type: [string, "null"]
              maxLength: 64
            nextRole:
              type: [string, "null"]
              maxLength: 64
            previousServiceIds:
              type: array
              maxItems: 100
              items:
                type: string
                maxLength: 200
            serviceIds:
              type: array
              maxItems: 100
              items:
                type: string
                maxLength: 200
            scope:
              type: string
              maxLength: 10000
            at:
              type: string
              minLength: 1
              maxLength: 40
            action:
              type: string
              maxLength: 200
            time:
              type: string
              maxLength: 40
            origin:
              type: string
              enum: [bootstrap]
    DevelopmentRoleArchiveReceipt:
      type: object
      required: [eventId, duplicate]
      properties:
        eventId:
          type: string
        duplicate:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ItsmStore:
      type: object
      description: ITSM pilot state; server-owned identity and timestamps are canonicalized on save.
      additionalProperties: true
    ItsmSnapshot:
      type: object
      properties:
        store:
          $ref: "#/components/schemas/ItsmStore"
        version:
          type: integer
          minimum: 0
      required: [store, version]
    ItsmPerson:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
      required: [userId, name]
    ItsmPeople:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/ItsmPerson"
      required: [people]
    ItsmContact:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        role: { type: string, enum: [N1, N2, N3] }
      required: [userId, name, role]
    ItsmContacts:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ItsmContact"
      required: [contacts]
    ItsmRoleReconciliationFinding:
      type: object
      properties:
        userId: { type: string }
        reason: { type: string, enum: [missing_audit, role_mismatch, scope_mismatch] }
        clerkRole: { type: string }
        clerkServiceIds: { type: array, items: { type: string } }
        auditRole: { type: [string, "null"] }
        auditServiceIds: { type: array, items: { type: string } }
      required: [userId, reason, clerkRole, clerkServiceIds, auditRole, auditServiceIds]
    ItsmRoleReconciliation:
      type: object
      properties:
        checkedAt: { type: string, format: date-time }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ItsmRoleReconciliationFinding"
      required: [checkedAt, findings]
    ItsmAuditIntegrity:
      type: object
      properties:
        status:
          type: string
          enum: [intact, broken, empty, unsealed]
        events:
          type: integer
          minimum: 0
        verified:
          type: integer
          minimum: 0
        pruned:
          type: integer
          minimum: 0
        head:
          type: [object, "null"]
          properties:
            seq: { type: integer, minimum: 1 }
            hash: { type: string }
          required: [seq, hash]
        firstBreak:
          type: [object, "null"]
          properties:
            seq: { type: [integer, "null"] }
            eventId: { type: [string, "null"] }
            reason: { type: string }
          required: [seq, eventId, reason]
        archive:
          type: object
          description: Comparison with the append-only seal archive kept by PostgreSQL triggers
          properties:
            status:
              type: string
              enum: [consistent, diverged, not_installed]
            archived: { type: integer, minimum: 0 }
            unarchived: { type: integer, minimum: 0, description: "Journal seals not archived yet" }
            firstMismatch:
              type: [object, "null"]
              properties:
                seq: { type: integer }
                reason: { type: string, enum: [missing, changed] }
              required: [seq, reason]
          required: [status, archived, unarchived, firstMismatch]
        merkle:
          type: [object, "null"]
          description: Merkle checkpoint of the whole journal (RFC 6962), when the chain is intact and matches the archive
          properties:
            root: { type: string }
            size: { type: integer, minimum: 1 }
          required: [root, size]
        checkedAt:
          type: string
          format: date-time
      required: [status, events, verified, pruned, head, firstBreak, archive, merkle, checkedAt]
    ItsmAuditTimestamp:
      type: object
      properties:
        id: { type: string }
        at: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        size: { type: integer }
        root: { type: string }
        statement: { type: string, description: "Text whose SHA-256 the authority signed" }
        tsaUrl: { type: [string, "null"] }
        genTime: { type: [string, "null"] }
        serial: { type: [string, "null"] }
        policy: { type: [string, "null"] }
        tsaSubject: { type: [string, "null"] }
        valid: { type: boolean, description: "Authority signature, imprint and timestamping certificate checked" }
        chainVerified: { type: boolean, description: "Authority certificate chains to a configured trusted root" }
        journalUnchanged: { type: boolean, description: "Today's first size events still give the timestamped root" }
        problem: { type: [string, "null"] }
      required: [id, at, actor, size, root, statement, tsaUrl, genTime, serial, policy, tsaSubject, valid, chainVerified, journalUnchanged, problem]
    ItsmAuditTimestamps:
      type: object
      properties:
        configured: { type: boolean }
        trustedRoots: { type: integer, minimum: 0 }
        timestamps:
          type: array
          items:
            $ref: "#/components/schemas/ItsmAuditTimestamp"
      required: [configured, trustedRoots, timestamps]
    ItsmAuditTimestampCreated:
      type: object
      properties:
        size: { type: integer }
        root: { type: string }
