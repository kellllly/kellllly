name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anif
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anif
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (vérifie aussi que le code généré correspond à openapi.yaml)
        run: pnpm run typecheck
      - name: Schéma de base de données
        run: pnpm --filter @workspace/db run push
      # Coverage gates (lines >= 90 %, branches >= 80 %, functions >= 85 %) on the
      # modules the tests import directly; see docs/comparaison-cahiers-des-charges.md.
      - name: Tests frontend et couverture
        run: pnpm --filter @workspace/anif-secure-desk run test:coverage
      - name: Tests API et couverture
        run: pnpm --filter @workspace/api-server run test:coverage
      - name: Build
        env:
          PORT: "5173"
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/anif-secure-desk run build
          pnpm --filter @workspace/api-server run build
